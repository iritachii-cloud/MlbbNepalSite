<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Creep Archive | MLBB Nepal</title>
  <link rel="icon" href="../assets/logo.png">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-base="../">
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="../index.html"><img src="../assets/logo.png" alt="Logo">CREEP ARCHIVE</a>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a href="../mlbb-wheel/index.html">Wheel</a>
        <a href="../mlbb-slot/index.html">Slot</a>
        <a href="../hero-card/index.html">Heroes</a>
        <a class="active" href="index.html">Creeps</a>
        <a href="../npc-card/index.html">NPCs</a>
        <a href="../maps/index.html">Maps</a>
      </div>
      <button class="icon-btn" data-theme-toggle>Theme Lab</button>
    </nav>
  </header>

  <main>
    <section class="page-hero container creep-hero">
      <div class="eyebrow">Jungle entities // Dual-form archive</div>
      <h1 class="display">Creep <span class="gradient-text">bestiarum.</span></h1>
      <p class="lead">Monster bodies, awakened human forms, threat ratings, combat indexes, weapons, auras, and the battlefield jobs that make these creatures worth fighting over.</p>
    </section>

    <section class="container creep-section">
      <div class="creep-toolbar panel">
        <input id="creepSearch" type="search" placeholder="Search creep, role, aura, weapon, or form...">
        <select id="creepClass">
          <option value="">All classes</option>
        </select>
        <select id="threatFilter">
          <option value="0">All threat ratings</option>
          <option value="8">Threat 8+</option>
          <option value="9">Threat 9+</option>
        </select>
        <span id="creepCount" class="status-pill">Loading...</span>
      </div>
      <div id="creepGrid" class="creep-grid"></div>
    </section>
  </main>

  <div class="modal creep-modal" id="creepModal">
    <article class="creep-profile panel">
      <button class="close-modal" data-close-modal="creepModal">&times;</button>
      <button class="profile-nav prev" id="prevCreep" aria-label="Previous creep">&lsaquo;</button>
      <button class="profile-nav next" id="nextCreep" aria-label="Next creep">&rsaquo;</button>
      <div id="creepDetail"></div>
    </article>
  </div>

  <script src="../assets/js/app.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
